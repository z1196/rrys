name: Test Parser

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Start server
        run: |
          node app.js &
          sleep 8

      - name: Test parser
        run: |
          echo "Requesting real playback URL..."
          curl "http://localhost:51888/parse?url=https://m.yichengwlkj.com/pc/drama/41068?episodeNo=1"
